<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#121816">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="PokerTool">
    <meta name="description" content="Explore poker ranges, practise decisions, replay sample hands, and keep a personal study notebook.">
    <title>PokerTool — Poker Study Club</title>
    <!-- Apply the palette before React mounts to prevent a flash on refresh. -->
    <script>
      (() => {
        let theme;
        try { theme = localStorage.getItem('pokerttool.theme'); } catch {}
        document.documentElement.dataset.theme = ['light', 'dark'].includes(theme)
          ? theme : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Enable JavaScript to use the PokerTool study room.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
